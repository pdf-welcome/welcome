<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta
      name="description"
      content="Pin Download webpage as PDF to your Chrome toolbar and save any webpage as a PDF."
    >
    <title>Download webpage as PDF is installed! Here’s how to get started.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/pdf-icon-32.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <header class="intro" aria-labelledby="welcome-title">
        <h1 id="welcome-title">
          <span class="headline-main">Download webpage as PDF <span class="headline-keep">is installed!&nbsp;🎉</span></span>
          <span class="headline-sub">Here’s how to get started.</span>
        </h1>
      </header>

      <section class="instruction" aria-labelledby="pin-step">
        <h2 class="step" id="pin-step">
          Open Extensions (1) in the top-right corner of Chrome. Then click the pin (2) next to Download webpage as PDF.
        </h2>
        <figure class="browser-shot">
          <img src="assets/pin-extension.png" alt="Open Chrome Extensions, then pin Download webpage as PDF">
        </figure>
      </section>

      <section class="instruction instruction--last" aria-labelledby="open-step">
        <h2 class="step" id="open-step">
          You’re ready! Click the PDF icon (3) whenever you want to save a webpage.
        </h2>
        <figure class="browser-shot">
          <img src="assets/open-extension.png" alt="Click the Download webpage as PDF icon in the Chrome toolbar">
        </figure>
      </section>
    </main>
  </body>
</html>
